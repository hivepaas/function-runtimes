; The runtime's PHP settings: production's, for processes that keep the
; handler loaded and answer calls one after another.

[PHP]
expose_php = Off
error_reporting = E_ALL
; Errors go to standard error, one line each, never into a response.
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0
zend.assertions = -1
; A call's timeout is the runtime's, which stops the process.
max_execution_time = 0
memory_limit = 128M
; $_ENV holds the function's variables, as getenv() does.
variables_order = "EGPCS"
default_charset = "UTF-8"

[Date]
date.timezone = UTC
